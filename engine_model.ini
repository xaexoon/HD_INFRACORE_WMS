; ═══════════════════════════════════════════════════════════
;  INFRACORE WMS — 엔진 모델 설정
;
;    ERP 지시가 들어오면 ORDER_H.KMATN(모델)으로 이 파일을 찾아
;    어느 라인인지, 공정을 자동 등록해도 되는지를 판단한다.
;
;    ※ 섹션 이름 = ERP 가 내려주는 KMATN 값과 정확히 같아야 한다.
;    ※ 모델이 추가되면 여기에 섹션을 추가하고 서버를 재시작한다.
;
;    작성 2026-08-31 / 근거 : 생산오더 인터페이스 샘플, DX37 BOM,
;                            2차 보급 대차 엑셀, 08-27 회의록
; ═══════════════════════════════════════════════════════════

[DEFAULT]
; 설정에 없는 모델이 들어왔을 때 쓰는 값.
; strict = true 면 미등록 모델의 지시를 가공하지 않고 오류로 남긴다.
line_type   = LARGE
line_name   = 미분류
auto_proc   = false
cart_yn     = false
strict      = true


; ── 대형 라인 ──────────────────────────────────────────────
;   공정 : 피킹리스트 = 1 : 1.  AMR 운반.  하루 1대.
;   ERP 가 공정·자재를 모두 내려주므로 사전 등록이 필요 없다.
[EDX08]
line_type   = LARGE
line_name   = 대형 라인
auto_proc   = true
cart_yn     = false
sloc        = SL68
arbpl_pre   = ADM
proc_digit  = true
; 참고 : 샘플 오더 기준 공정 43 / 자재 107 (팬텀 70 제외)
;        VORNR 10 ~ 980, 10 단위
;        ARBPL ADMA01(1직 10~240) ADMA02(2직 260~490)
;              ADMA03(3직 520~860) ADMT01(시운전 960~980)


; ── 초대형 라인 ────────────────────────────────────────────
;   공정 : 피킹리스트 = 1 : 1.  AMR 운반.
;   BOM 기준 공정 30 / 자재 607.  Opr.No. 는 4자리 숫자.
[DX-37]
line_type   = LARGE
line_name   = 초대형 라인
auto_proc   = true
cart_yn     = false
sloc        = SL11
arbpl_pre   = AGM
proc_digit  = true
; 참고 : 공정 접두 WH(세척) BH(블록서브) MH(모듈서브)
;                 HH(헤드서브) AH(조립) ZH(출하)
;        서픽스 OOG01~OOG05 — BOM 상 5종의 공정·자재가 동일함(확인 필요)
;        ZH2120 출하 공정에 자재 64종이 붙어 있음(피킹 대상인지 확인 필요)

[EDX37]
line_type   = LARGE
line_name   = 초대형 라인
auto_proc   = true
cart_yn     = false
sloc        = SL11
arbpl_pre   = AGM
proc_digit  = true

; ── 방산 라인 ──────────────────────────────────────────────
;   공정 : 피킹리스트 = N : 1.  대차 단위로 묶어 발행.  지게차 운반.
;   2~3일에 1대.  ERP 가 세부 구분자를 주지 못하므로
;   proc_master 를 엑셀로 미리 등록해야 한다(auto_proc = false).
;
;   ★ 섹션 이름은 임시값이다. ERP KMATN 실제 값 확인 후 교체할 것.
[B모델]
line_type   = DEFENSE
line_name   = 방산 라인
auto_proc   = false
cart_yn     = true
bs_yn       = true
proc_digit  = false
; 참고 : 대차 31 / 세부공정 52 / 상위공정 12 / 자재 598
;        공정 접두 AF(조립 384) SF(서브 162) WH(세척 2)
;        BS(볼트·와셔류) 184건은 공정번호가 없어 별도 경로로 대차 합류
;        공정↔대차 N:M — 한 대차에 공정 6개, 한 공정이 대차 5개까지


; ── 방산 라인 ──────────────────────────────────────────────
;   공정 : 피킹리스트 = N : 1.  대차 단위로 묶어 발행.  지게차 운반.
;   ERP 가 세부 구분자를 주지 못하므로 proc_master 를 사전 등록해야 한다.
;   ★ 섹션 이름은 임시값. ERP KMATN 실제 값 확인 후 교체할 것.
[EDX_DEF]
line_type   = DEFENSE
line_name   = 방산 라인
auto_proc   = true
cart_yn     = true
bs_yn       = true
proc_digit  = false

; ── 서브 라인 ──────────────────────────────────────────────
;   ★ 라인 성격 미확인. 대차 단위인지 공정 단위인지 확인 후 조정할 것.
[EDX_SUB]
line_type   = SUB
line_name   = 서브 라인
auto_proc   = true
cart_yn     = false
proc_digit  = true

; ═══════════════════════════════════════════════════════════
;  설정 항목
;
;    line_type    LARGE / DEFENSE.  화면 분기와 가공 규칙을 가른다
;    line_name    화면 표시용 이름
;    auto_proc    true  = 지시 수신 시 proc_master 에 없는 공정을 자동 등록
;                 false = 사전 등록 필수. 없으면 확정 단계에서 차단
;    cart_yn      true  = 대차(cart_code) 단위로 피킹리스트 발행
;                 false = 공정 하나가 피킹리스트 하나
;    bs_yn        true  = 공정번호 없는 자재(BS)가 존재하는 모델
;    sloc         ERP LGORT 기본값. 검증용 참고치
;    arbpl_pre    ERP ARBPL 접두. 모델 판정이 어긋날 때 교차 확인용
;    proc_digit   true  = 공정코드가 숫자.  분할 시 +1 연산이 가능
;                 false = 문자 포함.  분할 시 별도 규칙 필요
;    strict       [DEFAULT] 전용. 미등록 모델 지시를 오류로 처리할지
; ═══════════════════════════════════════════════════════════